<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A top-down 2D ant colony simulator where you shape ant behavior and watch the colony perform."
    />
    <title>Ants — Colony Simulator</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <h1>Ants</h1>
          <span class="brand-sub">colony simulator</span>
        </div>
        <div id="metrics" class="metrics"></div>
        <div id="controls" class="controls"></div>
      </header>
      <main id="stage">
        <canvas id="arena" aria-label="Ant colony arena"></canvas>
        <div id="hint" class="hint">Pick a tool, then click or drag on the arena.</div>
      </main>
      <aside id="sidebar">
        <section class="panel">
          <h2>Tools</h2>
          <div id="palette" class="palette"></div>
        </section>
        <section class="panel">
          <h2>Parameters</h2>
          <div id="sliders" class="sliders"></div>
        </section>
        <section class="panel legend">
          <h2>Legend</h2>
          <ul>
            <li><i class="sw home"></i>home trail</li>
            <li><i class="sw food"></i>food trail</li>
            <li><i class="sw attract"></i>attract</li>
            <li><i class="sw repel"></i>repel</li>
          </ul>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
